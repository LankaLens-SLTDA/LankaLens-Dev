services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lankalens-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    env_file:
      - path: ./backend/.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lankalens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lankalens-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - WATCHPACK_POLLING=true
    env_file:
      - path: ./frontend/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lankalens-network

networks:
  lankalens-network:
    driver: bridge
